# Version tags build a signed APK and publish a GitHub Release.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Write signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> gradle.properties <<EOF
          signingStoreFile=release.keystore
          signingStorePassword=$STORE_PASSWORD
          signingKeyAlias=$KEY_ALIAS
          signingKeyPassword=$KEY_PASSWORD
          EOF
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test --no-daemon
      - name: Assemble signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon -PversionName="${RELEASE_VERSION#v}" -PreleaseVersionCode="$((1000000 + GITHUB_RUN_NUMBER))"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "jicun-${RELEASE_VERSION#v}.apk"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          name: 暨存 ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: jicun-*.apk
