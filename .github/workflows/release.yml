# 发布签名 APK：兼容 Gitee 的 200/null 查询，并支持复用正式包修复分发。
#
# Gitee 先匿名校验附件 SHA-256，再发布清单；可选分发失败会警告并在摘要中单独标明。
#
# 另外可选：把 APK 同步到宣传页仓库（落地页自己托管安装包，下载才能保证是 .apk，
# 而不是被第三方图床标成 application/zip 后、被安卓浏览器存成 .zip）。缺配置同样跳过：
#   Secret    LANDING_TOKEN —— 对落地页仓库有 contents:write 权限的 GitHub 令牌
#   Variable  LANDING_REPO  —— 落地页仓库，默认 l0x0hhh/JICUN
# 没配也不要紧：落地页仓库自带一个每天拉取最新包的兜底 workflow。
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.2.0'
        required: true
        type: string
      reuse_published_apk:
        description: 'Reuse the existing GitHub APK to repair distribution without rebuilding'
        type: boolean
        default: false

# 不同版本也共用镜像 latest.json，因此所有正式发布都排队，避免清单互相覆盖。
# 但也不自动取消在跑的那个（cancel-in-progress: false）——上传一半被打断更麻烦，
# 后触发的排队等着就行。
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version)) }}
      REUSE_PUBLISHED_APK: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_published_apk || false }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: ${{ vars.GITEE_OWNER || 'l0x0hhh' }}
      GITEE_REPO: ${{ vars.GITEE_REPO || 'Jicun' }}
      LANDING_TOKEN: ${{ secrets.LANDING_TOKEN }}
      LANDING_REPO: ${{ vars.LANDING_REPO || 'l0x0hhh/JICUN' }}
      # App 更新源编译进 APK，与官网地址分开；旧包仍须通过旧源或手动覆盖安装过渡。
      APP_UPDATE_MANIFEST_URL: ${{ vars.APP_UPDATE_MANIFEST_URL || 'https://gitee.com/l0x0hhh/Jicun/raw/master/latest.json' }}
      # LIVE_* 仅校验官网，保留现有变量，切换 Gitee 时不要把它们改成镜像地址。
      LIVE_MANIFEST_URL: ${{ vars.LIVE_MANIFEST_URL || 'https://jicun.netlify.app/downloads/latest.json' }}
      LIVE_APK_URL: ${{ vars.LIVE_APK_URL || 'https://jicun.netlify.app/downloads/jicun.apk' }}
      # 可选：站点的 build hook。Netlify / Cloudflare Pages / Vercel 都提供这种"POST 一下
      # 就重新构建"的地址，本文件不绑定任何一家 —— 换托管时只需改这个 Secret。
      SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Validate the release version and update URL
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::正式版本必须是三段数字，例如 1.5.6 或 v1.5.6。"
            exit 1
          fi
          if [[ "$APP_UPDATE_MANIFEST_URL" != https://* ]]; then
            echo "::error::App 更新清单地址必须使用 HTTPS。"
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 可选镜像失败不阻断构建；下游必须检查 outcome，不能把 continue-on-error 当成功。
      - name: Resolve mirror settings
        id: mirror_settings
        continue-on-error: true
        if: env.GITEE_TOKEN != '' && env.GITEE_OWNER != '' && env.GITEE_REPO != ''
        run: |
          set -euo pipefail
          trap 'echo "::warning::Gitee 配置解析失败；本次仅继续 GitHub 正式发布。"' ERR
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          curl -fsS --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 5 \
            --get --data-urlencode "access_token=${GITEE_TOKEN}" "$API" > "$RUNNER_TEMP/gitee-repo.json"
          BRANCH=$(jq -er 'select(.public == true) | .default_branch | select(type == "string" and length > 0)' "$RUNNER_TEMP/gitee-repo.json")
          MANIFEST="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/raw/${BRANCH}/latest.json"
          if [ "$APP_UPDATE_MANIFEST_URL" != "$MANIFEST" ]; then
            echo "::warning::APP_UPDATE_MANIFEST_URL 与实际 Gitee 分支不一致，停止镜像同步。应配置为 ${MANIFEST}。"
            exit 1
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Gitee 镜像配置已确认：${MANIFEST}"

      - name: Decode signing key
        if: env.REUSE_PUBLISHED_APK != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Write signing properties
        if: env.REUSE_PUBLISHED_APK != 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> gradle.properties <<EOF
          signingStoreFile=release.keystore
          signingStorePassword=$STORE_PASSWORD
          signingKeyAlias=$KEY_ALIAS
          signingKeyPassword=$KEY_PASSWORD
          EOF
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Run tests
        if: env.REUSE_PUBLISHED_APK != 'true'
        run: ./gradlew test --no-daemon

      # 构建与 Gitee 清单回读共用 App 更新地址；Netlify 官网部署不参与 App 更新交付。
      - name: Assemble signed release APK
        if: env.REUSE_PUBLISHED_APK != 'true'
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionName="${RELEASE_VERSION#v}" \
            -PreleaseVersionCode="$((1000000 + GITHUB_RUN_NUMBER))" \
            -PupdateManifestUrl="${APP_UPDATE_MANIFEST_URL}"
      - name: Rename APK
        if: env.REUSE_PUBLISHED_APK != 'true'
        run: cp app/build/outputs/apk/release/app-release.apk "jicun-${RELEASE_VERSION#v}.apk"

      # 补同步必须使用已发布的原文件，不能重新构建同版本并覆盖附件。
      - name: Download and verify the published APK
        if: env.REUSE_PUBLISHED_APK == 'true'
        run: |
          set -euo pipefail
          APK="jicun-${RELEASE_VERSION#v}.apk"
          curl -fsSL --connect-timeout 15 --max-time 60 --retry 2 \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "$RUNNER_TEMP/published-release.json"
          URL=$(jq -er --arg name "$APK" '[.assets[] | select(.name == $name)][0].browser_download_url | select(startswith("https://"))' "$RUNNER_TEMP/published-release.json")
          DIGEST=$(jq -er --arg name "$APK" '[.assets[] | select(.name == $name)][0].digest | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/published-release.json")
          SIZE=$(jq -er --arg name "$APK" '[.assets[] | select(.name == $name)][0].size | select(type == "number" and . > 0)' "$RUNNER_TEMP/published-release.json")
          curl -fsSL --connect-timeout 15 --max-time 180 --retry 2 -o "$APK" "$URL"
          echo "${DIGEST#sha256:}  $APK" | sha256sum -c -
          [ "$(stat -c %s "$APK")" = "$SIZE" ]
          unzip -t "$APK" > /dev/null
          unzip -Z1 "$APK" > "$RUNNER_TEMP/published-apk-files.txt"
          grep -qx AndroidManifest.xml "$RUNNER_TEMP/published-apk-files.txt"
          echo "已验证并复用 ${RELEASE_TAG} 的原始正式包。"

      # 发版说明从 VERSION_HISTORY.md 里对应版本的条目取，不再写死在 workflow 里。
      # 此前这段文案从 v1.5.2 起一字未改，1.5.5 的用户在更新弹窗里看到的还是 1.5.2 的说明。
      # 取不到条目时退化成一句通用文案并给 warning：说明缺失不该拦住正式发布。
      - name: Extract the release notes
        id: release_notes
        run: |
          set -euo pipefail
          V="${RELEASE_VERSION#v}"
          FILE="$RUNNER_TEMP/release-notes.md"
          HEADING="## v${V}"
          # 用 index/substr 而不是正则：mawk 的 ERE 不支持交替，
          # 同时保证 "## v1.5.5" 不会误配到 "## v1.5.50"。
          awk -v head="$HEADING" '
            !found && index($0, head) == 1 && (length($0) == length(head) || substr($0, length(head) + 1, 1) == " ") { found = 1; next }
            found && substr($0, 1, 3) == "## " { exit }
            found { n++; buf[n] = $0 }
            END {
              # 段落首尾的空行不要带进 Release 说明。
              first = 0; last = 0
              for (i = 1; i <= n; i++) if (buf[i] ~ /[^[:space:]]/) { if (first == 0) first = i; last = i }
              for (i = first; i <= last; i++) print buf[i]
            }
          ' VERSION_HISTORY.md > "$FILE"
          if ! grep -q '[^[:space:]]' "$FILE"; then
            echo "::warning::VERSION_HISTORY.md 里没有 ${HEADING} 的条目，Release 说明退化为通用文案。下次发版前请先补上该条目。"
            printf '本次版本包含功能改进和问题修复。\n' > "$FILE"
          fi
          printf '\n完整变更记录：https://github.com/%s/blob/main/VERSION_HISTORY.md\n' "${GITHUB_REPOSITORY}" >> "$FILE"
          {
            echo "### 本次 Release 说明"
            echo ""
            cat "$FILE"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "path=${FILE}" >> "$GITHUB_OUTPUT"

      # GitHub 发布放在镜像之前：镜像那几步万一失败，正式包也已经发出去了，
      # 失败只会表现为"GitHub 成功、镜像没同步"，看得见、也不丢东西。
      - name: Create GitHub Release
        id: github_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 暨存 ${{ env.RELEASE_VERSION }}
          body_path: ${{ steps.release_notes.outputs.path }}
          # 复用时只同步说明，保留现有 GitHub APK；首次发布才上传新包。
          files: ${{ env.REUSE_PUBLISHED_APK != 'true' && 'jicun-*.apk' || '' }}

      # ---------- 国内镜像（Gitee）：先验证附件，再发布清单 ----------
      - name: Upload APK to the Gitee mirror
        id: mirror_attachment
        continue-on-error: true
        if: always() && steps.github_release.outcome == 'success' && steps.mirror_settings.outcome == 'success'
        env:
          MIRROR_BRANCH: ${{ steps.mirror_settings.outputs.branch }}
        run: |
          set -euo pipefail
          trap 'echo "::warning::Gitee 附件未验证通过，保留现有清单；GitHub 正式发布不受影响。"' ERR
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          APK="jicun-${RELEASE_VERSION#v}.apk"
          APK_URL="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${RELEASE_TAG}/${APK}"
          LOCAL_SHA=$(sha256sum "$APK" | cut -d ' ' -f1)
          LOCAL_SIZE=$(stat -c %s "$APK")

          # 只在确实不存在时创建发行版；鉴权或网络错误不能被误判成不存在。
          CODE=$(curl -sS --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 5 \
            --get --data-urlencode "access_token=${GITEE_TOKEN}" \
            -o "$RUNNER_TEMP/gitee-release.json" -w '%{http_code}' \
            "${API}/releases/tags/${RELEASE_TAG}") || CODE="000"
          # Gitee 查询缺失标签可能返回 HTTP 200 和字面值 null；仅此情况按缺失处理。
          if [ "$CODE" = "200" ] && jq -e 'type == "null"' "$RUNNER_TEMP/gitee-release.json" > /dev/null; then
            CODE="404"
          fi
          case "$CODE" in
            200) ;;
            404)
              curl -fsS --connect-timeout 15 --max-time 60 -X POST "${API}/releases" \
                --data-urlencode "access_token=${GITEE_TOKEN}" \
                --data-urlencode "tag_name=${RELEASE_TAG}" \
                --data-urlencode "name=暨存 ${RELEASE_VERSION#v}" \
                --data-urlencode "target_commitish=${MIRROR_BRANCH}" \
                --data-urlencode "body@$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/gitee-release.json"
              ;;
            *) echo "::warning::读取 Gitee 发行版失败（HTTP ${CODE}），停止镜像上传。"; exit 1 ;;
          esac
          REL_ID=$(jq -er '.id | select(type == "number")' "$RUNNER_TEMP/gitee-release.json")
          curl -fsS --connect-timeout 15 --max-time 60 --get \
            --data-urlencode "access_token=${GITEE_TOKEN}" \
            "${API}/releases/${REL_ID}/attach_files" > "$RUNNER_TEMP/gitee-files.json"
          jq -e 'type == "array"' "$RUNNER_TEMP/gitee-files.json" > /dev/null
          EXISTING=$(jq -r --arg name "$APK" '[.[] | select(.name == $name)] | length' "$RUNNER_TEMP/gitee-files.json")

          # 已有版本包不删除、不覆盖；内容不同须另发新版本，避免破坏正在下载的用户。
          if [ "$EXISTING" = "0" ]; then
            CODE="000"
            for attempt in 1 2 3; do
              CODE=$(curl -sS --connect-timeout 15 --max-time 180 \
                -o "$RUNNER_TEMP/gitee-upload.json" -w '%{http_code}' -X POST \
                "${API}/releases/${REL_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" -F "file=@${APK}") || CODE="000"
              echo "第 ${attempt} 次上传：HTTP ${CODE}"
              if [ "$CODE" = "201" ]; then break; fi
              # 上传超时可能已经落盘；先匿名回读同名文件，避免重复上传。
              if curl -fsSL --connect-timeout 15 --max-time 180 \
                -o "$RUNNER_TEMP/gitee-apk.apk" "$APK_URL" && \
                [ "$(sha256sum "$RUNNER_TEMP/gitee-apk.apk" | cut -d ' ' -f1)" = "$LOCAL_SHA" ]; then
                CODE="201"
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep 10; fi
            done
            if [ "$CODE" != "201" ]; then
              echo "::warning::Gitee 附件三次上传均未确认成功，停止发布镜像清单。"
              exit 1
            fi
          fi

          # 上传成功也不等于用户可下载：匿名 GET 必须拿到与本地完全相同的 APK。
          OK=0
          for attempt in 1 2 3; do
            if curl -fsSL --connect-timeout 15 --max-time 180 --retry 2 --retry-delay 5 \
              -o "$RUNNER_TEMP/gitee-apk.apk" "$APK_URL" && \
              [ "$(sha256sum "$RUNNER_TEMP/gitee-apk.apk" | cut -d ' ' -f1)" = "$LOCAL_SHA" ]; then
              OK=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          if [ "$OK" != "1" ]; then
            echo "::warning::Gitee 匿名 APK 下载或 SHA-256 校验失败，停止发布镜像清单。"
            exit 1
          fi
          {
            echo "verified=true"
            echo "apk_url=${APK_URL}"
            echo "sha256=${LOCAL_SHA}"
            echo "size=${LOCAL_SIZE}"
          } >> "$GITHUB_OUTPUT"
          echo "Gitee 附件匿名下载已验证（${LOCAL_SIZE} 字节）。"

      - name: Publish the mirror manifest
        id: mirror_manifest
        continue-on-error: true
        if: always() && steps.github_release.outcome == 'success' && steps.mirror_attachment.outcome == 'success' && steps.mirror_attachment.outputs.verified == 'true'
        env:
          MIRROR_BRANCH: ${{ steps.mirror_settings.outputs.branch }}
          MIRROR_APK_URL: ${{ steps.mirror_attachment.outputs.apk_url }}
          MIRROR_SHA256: ${{ steps.mirror_attachment.outputs.sha256 }}
          MIRROR_SIZE: ${{ steps.mirror_attachment.outputs.size }}
        run: |
          set -euo pipefail
          trap 'echo "::warning::Gitee 清单未验证通过；GitHub 正式发布不受影响，请查看分发摘要。"' ERR
          V="${RELEASE_VERSION#v}"
          WORK="$RUNNER_TEMP/gitee-mirror"
          AUTH=$(printf '%s:%s' "${GITEE_OWNER}" "${GITEE_TOKEN}" | base64 -w0)
          echo "::add-mask::${AUTH}"
          git -c "http.extraheader=Authorization: Basic ${AUTH}" clone --depth 1 \
            --branch "$MIRROR_BRANCH" "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" "$WORK"

          # 全局发布队列加版本检查，防止重跑旧标签将 latest.json 倒退。
          if [ -f "$WORK/latest.json" ]; then
            CURRENT=$(jq -er '.version | ltrimstr("v")' "$WORK/latest.json")
            if jq -en --arg current "$CURRENT" --arg target "$V" \
              '($current | split(".") | map(tonumber)) > ($target | split(".") | map(tonumber))' > /dev/null; then
              echo "::warning::Gitee 清单已是更高版本 ${CURRENT}，拒绝用 ${V} 覆盖。"
              exit 1
            fi
          fi
          # jq 安全保留说明中的引号和换行；额外完整性字段不影响旧 App 解析。
          jq -n --arg version "$V" --arg title "暨存 ${V}" \
            --rawfile notes "$RUNNER_TEMP/release-notes.md" \
            --arg apkUrl "$MIRROR_APK_URL" --arg sha256 "$MIRROR_SHA256" --argjson size "$MIRROR_SIZE" \
            '{version: $version, title: $title, notes: $notes, apkUrl: $apkUrl, sha256: $sha256, size: $size}' \
            > "$WORK/latest.json"
          git -C "$WORK" add -- latest.json
          if ! git -C "$WORK" diff --cached --quiet; then
            git -C "$WORK" -c user.name="jicun-release" -c user.email="release@users.noreply.github.com" \
              commit -q -m "release: 暨存 ${V}"
            git -C "$WORK" -c "http.extraheader=Authorization: Basic ${AUTH}" \
              push -q origin "HEAD:${MIRROR_BRANCH}"
          fi

          # 即使没有文件变化也回读线上；只认准确字段，不在全文搜索版本字符串。
          OK=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --connect-timeout 15 --max-time 60 \
              -o "$RUNNER_TEMP/gitee-live.json" "$APP_UPDATE_MANIFEST_URL" && \
              jq -e --arg version "$V" --arg apk "$MIRROR_APK_URL" --arg sha "$MIRROR_SHA256" --argjson size "$MIRROR_SIZE" \
                '.version == $version and .apkUrl == $apk and .sha256 == $sha and .size == $size' \
                "$RUNNER_TEMP/gitee-live.json" > /dev/null; then
              OK=1
              break
            fi
            echo "第 ${attempt} 次清单回读尚未一致。"
            if [ "$attempt" -lt 6 ]; then sleep 15; fi
          done
          if [ "$OK" != "1" ]; then
            echo "::warning::Gitee 清单版本、下载地址或完整性字段不一致，本次镜像未确认交付。"
            exit 1
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "Gitee 更新源已确认交付：${APP_UPDATE_MANIFEST_URL}"

      # ---------- 宣传页（落地页自托管安装包）----------
      # 落地页把 APK 放在自己站点里，下载才是同源直下、且能带正确的 Content-Type
      # （第三方图床会把 APK 标成 application/zip，安卓浏览器就存成 .zip）。
      # 和 Gitee 镜像一样：没配令牌就整段跳过，绝不拦住正式发布。
      # 官网是独立的可选分发点；仅在 GitHub 正式发布成功后同步。
      - name: Publish the APK to the landing page
        id: landing_apk
        continue-on-error: true
        if: always() && steps.github_release.outcome == 'success' && env.LANDING_TOKEN != ''
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/landing"
          AUTH=$(printf 'x-access-token:%s' "${LANDING_TOKEN}" | base64 -w0)
          echo "::add-mask::${AUTH}"
          git -c "http.extraheader=Authorization: Basic ${AUTH}" clone --depth 1 \
            "https://github.com/${LANDING_REPO}.git" "$WORK"
          mkdir -p "$WORK/public/downloads"
          cp "jicun-${RELEASE_VERSION#v}.apk" "$WORK/public/downloads/jicun.apk"
          jq -n --arg version "${RELEASE_VERSION#v}" --arg title "暨存 ${RELEASE_VERSION#v}" \
            --rawfile notes "$RUNNER_TEMP/release-notes.md" --arg apkUrl "$LIVE_APK_URL" \
            '{version: $version, title: $title, notes: $notes, apkUrl: $apkUrl}' \
            > "$WORK/public/downloads/latest.json"
          # 用 status --porcelain 判变化（git diff 看不出新增的未跟踪文件，踩过这个坑）。
          if [ -z "$(git -C "$WORK" status --porcelain -- public/downloads/jicun.apk public/downloads/latest.json)" ]; then
            echo "落地页的安装包已是最新，无需提交。"
            exit 0
          fi
          git -C "$WORK" add public/downloads/jicun.apk public/downloads/latest.json
          git -C "$WORK" -c user.name="jicun-release" -c user.email="release@users.noreply.github.com" \
            commit -q -m "chore: sync APK from 暨存 ${RELEASE_VERSION#v}"
          git -C "$WORK" -c "http.extraheader=Authorization: Basic ${AUTH}" push -q origin HEAD
          echo "已同步到落地页：public/downloads/jicun.apk（Netlify 应会自动重新部署）"

      # 站点若没接 Git 自动部署（或部署早就挂了），在命令行里推仓库是没用的 ——
      # 只能靠托管方的 build hook 主动踢一次。没配 hook 就只警告，不拦住发布。
      # v1.5.5 的事故正是这一段：仓库里是 1.5.5，线上站点停在 1.5.2，五天没人发现。
      - name: Trigger the site deploy
        id: site_deploy
        continue-on-error: true
        if: always() && steps.landing_apk.outcome == 'success'
        run: |
          if [ -z "${SITE_DEPLOY_HOOK}" ]; then
            echo "::warning::没有配置 SITE_DEPLOY_HOOK。若线上站点不是自动部署，仓库更新了、用户端也不会变。"
            exit 0
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            --connect-timeout 30 --max-time 120 --retry 3 --retry-delay 10 \
            "${SITE_DEPLOY_HOOK}") || CODE="000"
          echo "站点 build hook 返回 HTTP ${CODE}"
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::warning::站点 build hook 返回 HTTP ${CODE}，构建可能没有被触发。"
            exit 1
          fi

      # 官网交付独立验证：失败会在摘要标明，不阻断 Gitee 更新或 GitHub 正式发布。
      - name: Verify the product site endpoint
        id: live_endpoint
        continue-on-error: true
        if: always() && steps.landing_apk.outcome == 'success'
        run: |
          set -uo pipefail
          V="${RELEASE_VERSION#v}"
          APK="jicun-${V}.apk"
          LOCAL_SHA=$(sha256sum "$APK" | cut -d ' ' -f1)
          MANIFEST_OK=0
          APK_OK=0
          CT=""
          # 等待站点构建与 CDN 传播；版本匹配后才下载 APK 校验，避免重复下载旧包。
          for attempt in $(seq 1 12); do
            MANIFEST_OK=0
            APK_OK=0
            if curl -fsSL -D "$RUNNER_TEMP/live.hdr" -o "$RUNNER_TEMP/live.body" \
              --connect-timeout 15 --max-time 60 "$LIVE_MANIFEST_URL" && \
              jq -e --arg version "$V" --arg apk "$LIVE_APK_URL" \
                '.version == $version and .apkUrl == $apk' "$RUNNER_TEMP/live.body" > /dev/null; then
              MANIFEST_OK=1
              if curl -fsSL --connect-timeout 15 --max-time 180 \
                -o "$RUNNER_TEMP/site-apk.apk" "$LIVE_APK_URL" && \
                [ "$(sha256sum "$RUNNER_TEMP/site-apk.apk" | cut -d ' ' -f1)" = "$LOCAL_SHA" ]; then
                APK_OK=1
              fi
            fi
            CT=$(grep -i '^content-type:' "$RUNNER_TEMP/live.hdr" 2>/dev/null \
              | tail -1 | tr -d '\r' | sed 's/^[^:]*:[[:space:]]*//')
            echo "第 ${attempt} 次官网校验：清单=${MANIFEST_OK} APK哈希=${APK_OK} Content-Type=${CT}"
            if [ "$MANIFEST_OK" = "1" ] && [ "$APK_OK" = "1" ]; then break; fi
            if [ "$attempt" -lt 12 ]; then sleep 15; fi
          done

          FAIL=0
          if [ "$MANIFEST_OK" != "1" ]; then
            echo "::warning::官网清单 ${LIVE_MANIFEST_URL} 尚未交付 ${V}，请检查托管平台部署状态及额度。Gitee 更新源独立校验。"
            FAIL=1
          fi
          if [ "$APK_OK" != "1" ]; then
            echo "::warning::官网 APK ${LIVE_APK_URL} 未通过匿名下载或 SHA-256 校验，请勿宣布官网下载已更新。"
            FAIL=1
          fi
          case "$CT" in
            *application/json*) ;;
            *) echo "::warning::线上清单的 Content-Type 是「${CT}」，不是 application/json。App 不受影响，但浏览器会把清单当成文件下载；应给 /downloads/*.json 单独声明响应头。" ;;
          esac
          if [ "$FAIL" != "0" ]; then exit 1; fi
          echo "官网清单与 APK 已确认交付 ${V}。"

      # 一眼看清全部分发点各自的成败。以前镜像失败会让 run 直接红掉、
      # 后面的跳过点只在折叠的日志里躺着，得点开才看得见。
      - name: Summarise the release
        if: always()
        env:
          GITHUB_REL: ${{ steps.github_release.outcome }}
          ATTACHMENT: ${{ steps.mirror_attachment.outcome }}
          MANIFEST: ${{ steps.mirror_manifest.outcome }}
          MIRROR_VERIFIED: ${{ steps.mirror_manifest.outputs.verified }}
          LANDING: ${{ steps.landing_apk.outcome }}
          SITE_DEPLOY: ${{ steps.site_deploy.outcome }}
          LIVE: ${{ steps.live_endpoint.outcome }}
        run: |
          V="${RELEASE_VERSION#v}"
          label() { case "$1" in success) echo "已同步";; skipped) echo "跳过";; *) echo "失败";; esac; }
          {
            echo "### 暨存 ${V} 分发结果"
            echo ""
            echo "| 分发点 | 结果 |"
            echo "| --- | --- |"
            echo "| GitHub Release | $(label "$GITHUB_REL") |"
            echo "| Gitee 镜像附件 | $(label "$ATTACHMENT") |"
            echo "| Gitee 更新清单（版本、地址、哈希） | $(label "$MANIFEST") |"
            echo "| 落地页安装包 | $(label "$LANDING") |"
            echo "| 站点点部署触发 | $(label "$SITE_DEPLOY") |"
            echo "| 官网清单与 APK | $(label "$LIVE") |"
            echo ""
            if [ "$MIRROR_VERIFIED" = "true" ]; then
              echo "**Gitee 备用更新已确认交付 ${V}；官网状态单独查看。**"
            else
              echo "**Gitee 备用更新未确认交付 ${V}。流水线成功只代表 GitHub 正式发布，不代表镜像或官网已更新。**"
            fi
            echo ""
            echo "- App 编译进包的更新地址：${APP_UPDATE_MANIFEST_URL}。"
            echo "- Gitee 失败或跳过：检查 GITEE_TOKEN 的有效期、仓库权限和镜像步骤日志；旧清单不会因附件失败而被更新。"
            echo "- 官网部署失败：不影响已验证的 Gitee 更新；Netlify 旧入口仍需恢复或告知旧用户手动覆盖安装。"
            echo "- 落地页安装包跳过：本次没有配 LANDING_TOKEN，站点靠落地页仓库每天 09:17 的兜底 workflow 同步。"
            echo "- 已安装旧包不会自动更改更新源，需经旧源、GitHub 或手动覆盖安装进入新版本。"
          } >> "$GITHUB_STEP_SUMMARY"
