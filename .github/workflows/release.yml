# Version tags build a signed APK and publish a GitHub Release.
#
# 如果配了国内镜像（Gitee），还会同步一份：APK 作为 Gitee Release 附件，
# latest.json 提交到镜像仓库主分支供 raw 直链读取（应用内的更新检查会读它）。
# 需要 3 个仓库配置，缺任何一个都会自动跳过镜像、只发 GitHub：
#   Secret    GITEE_TOKEN   —— Gitee 私人令牌，勾 projects（仓库读写）权限
#   Variable  GITEE_OWNER   —— Gitee 用户名，例如 l0x0hhh
#   Variable  GITEE_REPO    —— Gitee 镜像仓库名，例如 Jicun
#
# 另外可选：把 APK 同步到宣传页仓库（落地页自己托管安装包，下载才能保证是 .apk，
# 而不是被第三方图床标成 application/zip 后、被安卓浏览器存成 .zip）。缺配置同样跳过：
#   Secret    LANDING_TOKEN —— 对落地页仓库有 contents:write 权限的 GitHub 令牌
#   Variable  LANDING_REPO  —— 落地页仓库，默认 l0x0hhh/JICUN
# 没配也不要紧：落地页仓库自带一个每天拉取最新包的兜底 workflow。
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.2.0'
        required: true
        type: string

# 发版不能并发跑：两个 run 同时往同一个 Gitee release 传附件会互相踩。
# 但也不自动取消在跑的那个（cancel-in-progress: false）——上传一半被打断更麻烦，
# 后触发的排队等着就行。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: ${{ vars.GITEE_OWNER }}
      GITEE_REPO: ${{ vars.GITEE_REPO }}
      LANDING_TOKEN: ${{ secrets.LANDING_TOKEN }}
      LANDING_REPO: ${{ vars.LANDING_REPO || 'l0x0hhh/JICUN' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 解析镜像分支并算出清单地址，写进 $GITHUB_ENV 给后面的步骤用。
      # 这里的任何问题都只警告、不失败：镜像不该拦住正式的 GitHub 发布。
      - name: Resolve mirror settings
        if: env.GITEE_TOKEN != '' && env.GITEE_OWNER != '' && env.GITEE_REPO != ''
        run: |
          set -uo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          BRANCH=$(curl -s --connect-timeout 30 --retry 3 --retry-delay 5 "${API}?access_token=${GITEE_TOKEN}" | jq -r '.default_branch // empty')
          if [ -z "$BRANCH" ]; then
            echo "::warning::Gitee 镜像仓库 ${GITEE_OWNER}/${GITEE_REPO} 还没有分支。请在网页上创建一个文件（例如 latest.json）产生首个提交后重跑。本次跳过镜像同步。"
            exit 0
          fi
          MANIFEST="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/raw/${BRANCH}/latest.json"
          echo "MIRROR_BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          echo "MIRROR_MANIFEST_URL=${MANIFEST}" >> "$GITHUB_ENV"
          echo "镜像分支 ${BRANCH}，清单地址 ${MANIFEST}"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Write signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> gradle.properties <<EOF
          signingStoreFile=release.keystore
          signingStorePassword=$STORE_PASSWORD
          signingKeyAlias=$KEY_ALIAS
          signingKeyPassword=$KEY_PASSWORD
          EOF
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test --no-daemon

      # 清单地址要编译进 APK（BuildConfig.UPDATE_MANIFEST_URL），所以必须在这一步就确定。
      # 没配镜像时它是空串，应用会走 GitHub Release 回退。
      - name: Assemble signed release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionName="${RELEASE_VERSION#v}" \
            -PreleaseVersionCode="$((1000000 + GITHUB_RUN_NUMBER))" \
            -PupdateManifestUrl="${MIRROR_MANIFEST_URL:-}"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "jicun-${RELEASE_VERSION#v}.apk"

      # GitHub 发布放在镜像之前：镜像那几步万一失败，正式包也已经发出去了，
      # 失败只会表现为"GitHub 成功、镜像没同步"，看得见、也不丢东西。
      - name: Create GitHub Release
        id: github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 暨存 ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: jicun-*.apk

      # ---------- 国内镜像（Gitee）----------
      # 顺序刻意是「先附件、后清单」：清单一旦上线就会被用户读到，
      # 反过来会出现一段"用户点了更新却 404"的窗口。
      - name: Upload APK to the Gitee mirror
        id: mirror_attachment
        if: env.MIRROR_BRANCH != ''
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          APK="jicun-${RELEASE_VERSION#v}.apk"

          # 同名 release 就复用，保证本步骤可以重复执行（重跑流水线不会 400）
          REL_ID=$(curl -s --connect-timeout 30 --retry 3 --retry-delay 5 -H "Content-Type: application/json" \
            "${API}/releases/tags/${RELEASE_TAG}?access_token=${GITEE_TOKEN}" | jq -r '.id // empty' || true)
          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -s -X POST "${API}/releases" \
              -d "access_token=${GITEE_TOKEN}" \
              -d "tag_name=${RELEASE_TAG}" \
              -d "name=暨存 ${RELEASE_VERSION#v}" \
              -d "target_commitish=${MIRROR_BRANCH}" \
              -d "body=国内镜像。对应 GitHub Release：https://github.com/l0x0hhh/zongce/releases/tag/${RELEASE_TAG}" \
              | jq -r '.id // empty')
          fi
          if [ -z "$REL_ID" ]; then
            echo "::error::Gitee 上既找不到也无法创建 release ${RELEASE_TAG}"
            exit 1
          fi
          echo "Gitee release id = ${REL_ID}"

          # 同名附件先删，避免重复上传（Gitee 不会自动覆盖）
          curl -s "${API}/releases/${REL_ID}/attach_files?access_token=${GITEE_TOKEN}" \
            | jq -r --arg n "$APK" '.[] | select(.name == $n) | .id' \
            | while read -r fid; do
                [ -n "$fid" ] && curl -s -o /dev/null -X DELETE \
                  "${API}/releases/${REL_ID}/attach_files/${fid}?access_token=${GITEE_TOKEN}"
              done

          # 上传：multipart/form-data，文件字段名固定为 file。
          # 13MB 走国际链路本来就慢，偶发失败是常态（v1.4.0 就是一次失败把后面全带走了），
          # 所以要重试：最多 3 次，每次间隔 30 秒，只认 HTTP 201 才算成功。
          CODE=""
          for attempt in 1 2 3; do
            echo "第 ${attempt} 次上传 ${APK}（$(du -h "$APK" | cut -f1)）"
            # 用 || CODE=000 兜住 curl 自身的失败（连接中断、超时），
            # 否则 set -e 会在第一次网络抖动时就直接把脚本掐掉，根本走不到重试。
            CODE=$(curl -s --connect-timeout 30 --max-time 1200 -o /tmp/gitee-attach.json -w '%{http_code}' -X POST \
              "${API}/releases/${REL_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${APK}") || CODE="000"
            echo "上传返回 HTTP ${CODE}"
            if [ -f /tmp/gitee-attach.json ]; then cat /tmp/gitee-attach.json; fi
            if [ "$CODE" = "201" ]; then break; fi
            if [ "$attempt" -lt 3 ]; then echo "未成功，30 秒后重试"; sleep 30; fi
          done
          if [ "$CODE" != "201" ]; then
            echo "::error::向 Gitee 上传 ${APK} 三次都失败（最后一次 HTTP ${CODE}）。镜像本轮不会更新，GitHub 正式发布不受影响。"
            exit 1
          fi

      # 清单用 git push 更新（而不是 contents API）：语义明确、没有"新建还是更新、要不要 sha"的歧义，
      # 镜像仓库只有一个 JSON，克隆成本可以忽略。
      # 附件没传成功就绝对不要写清单：清单里的 apkUrl 指向 Gitee 附件，
      # 附件不存在等于给用户一个 404 的更新按钮。所以这一步盯的是上一步的 outcome。
      - name: Publish the mirror manifest
        id: mirror_manifest
        if: always() && env.MIRROR_BRANCH != '' && steps.mirror_attachment.outcome == 'success'
        run: |
          set -euo pipefail
          V="${RELEASE_VERSION#v}"
          APK="jicun-${V}.apk"
          APK_URL="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${RELEASE_TAG}/${APK}"
          WORK="$RUNNER_TEMP/gitee-mirror"

          # 令牌走 Authorization 头，不拼进 URL：拼进 URL 时若令牌含特殊字符会被
          # percent-encode，GitHub 的 secret 掩码就认不出来了，有漏进日志的风险。
          AUTH=$(printf '%s:%s' "${GITEE_OWNER}" "${GITEE_TOKEN}" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic ${AUTH}" clone --depth 1 \
            "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" "$WORK"
          cat > "$WORK/latest.json" <<JSON
          {
            "version": "${V}",
            "title": "暨存 ${V}",
            "notes": "国内镜像下载；GitHub 备份见 https://github.com/l0x0hhh/zongce/releases/tag/${RELEASE_TAG}",
            "apkUrl": "${APK_URL}"
          }
          JSON
          # 注意必须先 add：latest.json 是新文件，commit -am 只覆盖已跟踪文件的改动，
          # 镜像仓库里没有它时会"nothing to commit"直接失败（v1.2.1 首跑就栽在这）。
          git -C "$WORK" add -A
          git -C "$WORK" -c user.name="jicun-release" -c user.email="release@users.noreply.github.com" \
            commit -q -m "release: 暨存 ${V}"
          git -C "$WORK" -c "http.extraheader=Authorization: Basic ${AUTH}" \
            push -q origin "HEAD:${MIRROR_BRANCH}"

          # 回读校验：确认清单真的能被匿名读到、且版本号对得上。
          # 国内镜像的全部价值就是"用户能读到它"，没校验过的写入不算写完。
          # 必须带 -L：Gitee 的 /raw/ 会 302 跳到 raw.giteeusercontent.com，
          # 不跟跳转只会抓到那个跳转页 HTML，导致误报"内容里没有版本号"（v1.2.1 就栽在这）。
          # 一回合一回合地等，而不是"睡 5 秒查一次就定罪"：Gitee 的 raw 走 CDN，
          # 刚 push 完立刻读经常拿回旧内容。v1.3.5 就是这么被误判失败的——
          # 文件其实写进去了，却把整条流水线判死、还连累了后面的落地页同步。
          # 最多等 6 × 15 = 90 秒；这段只在附件成功后才跑，不值得为它省时间。
          OK=0
          for attempt in $(seq 1 6); do
            sleep 15
            FETCHED=$(curl -sL -f --connect-timeout 30 --max-time 120 --retry 3 --retry-delay 5 \
              "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/raw/${MIRROR_BRANCH}/latest.json") || FETCHED=""
            echo "第 ${attempt} 次回读：${FETCHED}"
            if echo "$FETCHED" | grep -q "\"${V}\""; then OK=1; break; fi
          done
          if [ "$OK" != "1" ]; then
            echo "::error::清单回读校验失败：等了 90 秒仍读不到版本号 ${V}"
            exit 1
          fi
          echo "镜像清单已就绪：https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/raw/${MIRROR_BRANCH}/latest.json"

      # ---------- 宣传页（落地页自托管安装包）----------
      # 落地页把 APK 放在自己站点里，下载才是同源直下、且能带正确的 Content-Type
      # （第三方图床会把 APK 标成 application/zip，安卓浏览器就存成 .zip）。
      # 和 Gitee 镜像一样：没配令牌就整段跳过，绝不拦住正式发布。
      # always()：这一步只依赖本地那个 APK 文件，跟 Gitee 镜像成不成无关。
      # 之前写的是 env.LANDING_TOKEN != ''，结果镜像一失败它就跟着 skipped，
      # 官网的安装包从此落后一个大版本（v1.4.0 就是这么卡在 1.3.6 的）。
      - name: Publish the APK to the landing page
        id: landing_apk
        if: always() && env.LANDING_TOKEN != ''
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/landing"
          AUTH=$(printf 'x-access-token:%s' "${LANDING_TOKEN}" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic ${AUTH}" clone --depth 1 \
            "https://github.com/${LANDING_REPO}.git" "$WORK"
          mkdir -p "$WORK/public/downloads"
          cp "jicun-${RELEASE_VERSION#v}.apk" "$WORK/public/downloads/jicun.apk"
          # 用 status --porcelain 判变化（git diff 看不出新增的未跟踪文件，踩过这个坑）。
          if [ -z "$(git -C "$WORK" status --porcelain -- public/downloads/jicun.apk)" ]; then
            echo "落地页的安装包已是最新，无需提交。"
            exit 0
          fi
          git -C "$WORK" add public/downloads/jicun.apk
          git -C "$WORK" -c user.name="jicun-release" -c user.email="release@users.noreply.github.com" \
            commit -q -m "chore: sync APK from 暨存 ${RELEASE_VERSION#v}"
          git -C "$WORK" -c "http.extraheader=Authorization: Basic ${AUTH}" push -q origin HEAD
          echo "已同步到落地页：public/downloads/jicun.apk（Netlify 会自动重新部署）"

      # 一眼看清四个分发点各自的成败。以前镜像失败会让 run 直接红掉、
      # 后面的跳过点只在折叠的日志里躺着，得点开才看得见。
      - name: Summarise the release
        if: always()
        env:
          GITHUB_REL: ${{ steps.github_release.outcome }}
          ATTACHMENT: ${{ steps.mirror_attachment.outcome }}
          MANIFEST: ${{ steps.mirror_manifest.outcome }}
          LANDING: ${{ steps.landing_apk.outcome }}
        run: |
          V="${RELEASE_VERSION#v}"
          label() { case "$1" in success) echo "已同步";; skipped) echo "跳过";; *) echo "失败";; esac; }
          {
            echo "### 暨存 ${V} 分发结果"
            echo ""
            echo "| 分发点 | 结果 |"
            echo "| --- | --- |"
            echo "| GitHub Release | $(label "$GITHUB_REL") |"
            echo "| Gitee 镜像附件 | $(label "$ATTACHMENT") |"
            echo "| Gitee 镜像清单 | $(label "$MANIFEST") |"
            echo "| 落地页安装包 | $(label "$LANDING") |"
            echo ""
            echo "镜像未同步时，应用仍能通过 GitHub 源检查到 ${V}，只是国内下载会慢。"
          } >> "$GITHUB_STEP_SUMMARY"
